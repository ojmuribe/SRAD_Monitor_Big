; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32_8048s070c
src_dir = src
data_dir = data

; put the files to upload in MCU filesystem in the data direcotry


[env]
build_src_filter = +<*> -<docs/>
lib_deps = 
	lvgl/lvgl@^9.5.0
	moononournation/GFX Library for Arduino
	tamctec/TAMC_GT911@^1.0.2
	mobizt/ReadyMail@^0.4.1

[env:esp32_8048s070c]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

lib_ignore =
    SD

; https://github.com/espressif/esp-idf/tree/master/components/partition_table
; https://github.com/espressif/arduino-esp32/tree/master/tools/partitions
; board_build.partitions = no_ota.csv
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi   ; habilita PSRAM octal
board_build.flash_size = 16MB

; this let you to download/backup the spiffs saved bank.
; uncomment following line and download https://github.com/maxgerhardt/pio-esp32-esp8266-filesystem-downloader/raw/main/download_fs.py
; extra_scripts = download_fs.py

monitor_speed = 115200
build_flags =
	-I include
	-I src/config
	-D BOARD_HAS_PSRAM
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-mfix-esp32-psram-cache-issue
	-D LV_CONF_INCLUDE_SIMPLE
	-include string.h  ; fuerza <string.h> en todos los .c/.cpp (fix strcmp en ui.c autogenerado por EEZ Studio)